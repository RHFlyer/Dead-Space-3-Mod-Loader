# Build check: every push to main and every pull request builds the loader and all six add-ons from this source,
# so anyone can see that the code compiles as published. It is not how releases are made: the release zips are
# built locally (scripts/package-release.ps1) and tested in the game first. The build output is kept for 7 days as
# an unofficial test build, never as a release.
name: Build

on:
  push:
    branches: [main]
  pull_request:

# Read-only: this workflow can't change the repository, and it uses no secrets.
permissions:
  contents: read

jobs:
  build:
    name: Win32 Release build
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      # actions/checkout v7.0.1, pinned to its commit. MinHook is a submodule.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: true
          persist-credentials: false

      # Dead Space 3 is 32-bit, so the loader and every mod are 32-bit DLLs (-A Win32).
      - name: Configure
        run: cmake -S . -B build -A Win32

      - name: Build the loader and the six add-ons
        run: cmake --build build --config Release

      - name: Check that every part was built, 32-bit
        run: |
          $files = @(
            'build/Release/dinput8.dll',
            'build/plugins/RawInputMouseFix/DS3RawMouse.asi',
            'build/plugins/SealStore/SealStore.asi',
            'build/plugins/AutoPickup/AutoPickup.asi',
            'build/plugins/ResourceCounter/ResourceCounter.asi',
            'build/plugins/HelloMod/HelloMod.asi',
            'build/plugins/MouseSliderRange/mod.ini'
          )
          foreach ($f in $files) {
            if (-not (Test-Path -LiteralPath $f)) { throw "missing: $f" }
            if ($f -match '\.(dll|asi)$') {
              $bytes = [IO.File]::ReadAllBytes((Resolve-Path $f))
              $pe = [BitConverter]::ToInt32($bytes, 0x3C)
              if ([BitConverter]::ToUInt16($bytes, $pe + 4) -ne 0x14C) { throw "not a 32-bit DLL: $f" }
            }
            "ok  $f"
          }

      - name: Label the output as a test build
        run: |
          Set-Content -Encoding utf8 build/NOT-A-RELEASE.txt @(
            'Unofficial test build made by GitHub Actions from commit ' + $env:GITHUB_SHA + '.',
            'It shows that the source compiles. It was not tested in the game.',
            'To play, use the release downloads on the Releases page instead.'
          )

      # actions/upload-artifact v7.0.2, pinned to its commit. Kept for 7 days.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: unofficial-test-build-${{ github.sha }}
          path: |
            build/NOT-A-RELEASE.txt
            build/Release/dinput8.dll
            build/plugins/RawInputMouseFix/
            build/plugins/SealStore/
            build/plugins/AutoPickup/
            build/plugins/ResourceCounter/
            build/plugins/HelloMod/
            build/plugins/MouseSliderRange/
          retention-days: 7
          if-no-files-found: error
