; DS3 Mod Loader: settings. Put next to dinput8.dll in the game folder.

[modules]
; One switch per mod, and one for the Mods panel. 1 = on, 0 = off.
; Easier: pause the game and choose "mods" (or press F11, or Back on a pad) to open the Mods panel. It lists every
; setting below except the keys, button and pause-button placement of [mods_menu], saves changes to this file at
; once, and says which apply now and which after a restart.

; Optional add-ons (the Raw Input Mouse Fix in plugins\RawInputMouseFix, the Ration Seal Store in
; plugins\SealStore, Auto Pickup in plugins\AutoPickup, ...): an add-on's switch (raw_mouse, seal_store,
; auto_pickup, ...) appears below once it is installed, and its own settings are in an ini in its folder.

; Drop-in mods: every folder in plugins\ with a mod.ini gets a switch here, named by the mod. A newly found mod is
; added as off (=0); switch it on here or in the Mods panel, and it loads from the next start.

; The Mods panel over the pause menu. Settings under [mods_menu]. 0 = no panel; edit this file by hand instead.
mods_menu=1


[mods_menu]
; Text size of the panel in percent (100 = medium).
text_size=100
; What opens the panel while the game is paused. key: a Windows virtual-key code (0x7A = F11, 0 = none).
; pad_button: an XInput button (0x20 = Back, 0x10 = Start, 0 = none). Esc or B closes the panel.
key=0x7A
pad_button=0x20
; 1 = a "mods" button under the pause menu's rows, reached like one more row (down from "save and quit", up from
; "checkpoint restart") or with the mouse. pause_button_x / _y move it, in pixels at 1080p; read each time you pause.
pause_button=1
pause_button_x=0
pause_button_y=0
