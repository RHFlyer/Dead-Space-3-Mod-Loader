; Auto Pickup's manifest: what the DS3 Mod Loader and its Mods panel need to know about the add-on.
; Format: sdk\README.md. Comments go on their own lines (a ; after a value is part of the value).

[mod]
name=Auto Pickup
; The [modules] key in ds3_mods.ini. Don't change it after release.
id=auto_pickup
author=RHFlyer
version=1.0.0
; The oldest DS3 Mod Loader this add-on works with. An older loader says so instead of loading it.
min_loader=1.0.0
description=Collects dropped items all around you without an Ammo Sweeper on your weapon, and lists what you just picked up.
file=AutoPickup.asi
; Created by the Mods panel on the first change. The test-only [debug] log_pickup_candidates=1 goes there by hand.
ini=auto_pickup.ini

; Each [setting.*] section is one row in the Mods panel, in this order. Every one applies at once: the add-on re-reads
; auto_pickup.ini when the panel changes a row (DS3ModSettingsChanged in auto_pickup.cpp).

[setting.enabled]
section=auto_pickup
key=enabled
kind=bool
default=1
label=Collect items automatically
help=On: items are collected as if every weapon had an Ammo Sweeper attached. Off: only a real Ammo Sweeper collects.

[setting.categories]
section=auto_pickup
key=categories
kind=choice
choices=0xFFFFFFFF:Everything|0xB:Ammo, med packs, resources|0xA:Ammo and resources|0x2:Ammo only
default=0xFFFFFFFF
label=Collects
help=Which kinds of item are collected automatically.

[setting.all_around]
section=auto_pickup
key=all_around
kind=bool
default=1
label=All around you
help=On: items are collected in every direction, even ones flying past you. Off: only in front, like the prompt.

[setting.radius]
section=auto_pickup
key=radius
kind=int
min=0
max=10
default=4
unit=m
label=Reach
help=How far around you items are collected, with All around you on. 0: only what you touch (the game's reach).

[setting.skip_weapon_parts]
section=auto_pickup
key=skip_weapon_parts
kind=bool
default=1
label=Leave weapons, parts and circuits
help=On: weapons, weapon parts, circuits and the Scavenger Bot stay on the floor for you to pick up.

[setting.skip_quest_items]
section=auto_pickup
key=skip_quest_items
kind=bool
default=1
label=Leave keys and mission items
help=On: keys and mission items stay where they are, so picking one up never starts a scene by surprise.

[setting.max_med_packs]
section=auto_pickup
key=max_med_packs
kind=int
min=0
max=99
default=5
label=Med packs, up to
help=Stop collecting med packs once you carry this many. You can still take more yourself. 0 = no limit.

[setting.max_stasis_packs]
section=auto_pickup
key=max_stasis_packs
kind=int
min=0
max=99
default=5
label=Stasis packs, up to
help=Stop collecting stasis packs once you carry this many. 0 = no limit.

[setting.min_open_slots]
section=auto_pickup
key=min_open_slots
kind=int
min=0
max=25
default=5
label=Inventory slots kept free
help=A kind of item you do not carry yet is only collected while more than this many inventory slots are free.

[setting.list]
section=pickup_log
key=enabled
kind=bool
default=1
label=Show the list
help=A small list in the bottom-right corner of what you just picked up.
group=Pickup list

[setting.list_lines]
section=pickup_log
key=lines
kind=int
min=1
max=12
default=6
label=Lines
help=How many lines the pickup list shows at once.
group=Pickup list

[setting.list_seconds]
section=pickup_log
key=seconds
kind=int
min=1
max=60
default=5
unit=s
label=Time on screen
help=How long each line stays.
group=Pickup list

[setting.list_text_size]
section=pickup_log
key=text_size
kind=int
min=50
max=300
step=10
default=100
unit=%
label=Text size
help=Size of the pickup list text.
group=Pickup list
