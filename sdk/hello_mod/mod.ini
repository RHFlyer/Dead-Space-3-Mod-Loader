; Hello Mod's manifest. To start a mod of your own, follow the SDK guide (sdk\README.md, also in the
; source download): it starts from resource_counter.
; Format: sdk\README.md. Comments go on their own lines (a ; after a value is part of the value).

[mod]
name=Hello Mod
; Your [modules] key in ds3_mods.ini: a-z, 0-9 and _ only. Never change it once the mod is out: the player's
; switch hangs on it.
id=hello_mod
author=RHFlyer
; Three numbers. Third up: a fix. Second: something new. First: the player has to do something (CHANGELOG.txt says what).
version=1.1.0
; The oldest DS3 Mod Loader this mod works with. An older loader says so instead of loading it.
min_loader=1.0.0
description=A sample mod. Writes to ds3_mods.log at start and when a setting changes; its hotkey greets you on screen too.
; Paths are relative to this folder. The ini holds the player's settings: the Mods panel creates it on the first
; change, and it is never shipped, so an update can't reset it. Defaults are below and in hello_mod.cpp.
file=HelloMod.asi
ini=hello_mod.ini

[setting.greet]
section=Hello
key=Greet
kind=bool
default=1
label=Greet on the hotkey
help=On: pressing the hotkey shows the greeting on screen and writes it to ds3_mods.log.

[setting.greeting]
section=Hello
key=Greeting
kind=choice
choices=hello:Hello|hi:Hi|howdy:Howdy
default=hello
label=Greeting

[setting.repeat]
section=Hello
key=Repeat
kind=int
min=1
max=5
default=1
label=Times per press
unit=x

[setting.volume]
section=Hello
key=Volume
kind=float
min=0
max=1
step=0.05
default=0.50
label=Volume (does nothing)
help=A float setting, to show how one looks. The mod only logs it.

[setting.hotkey]
section=Hello
key=Hotkey
kind=key
default=F12
label=Hotkey
help=Enter: press the key to use. Left / Right: step through F1-F12 and others.
group=Hello Mod keys
