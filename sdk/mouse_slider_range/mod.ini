; A patch mod: it changes one number in the game, with no DLL and no code. Lines starting with ; are comments.
; The format is explained in sdk\README.md, under "Patch mods".
;
; What it does: the game turns its Mouse Sensitivity slider (Options, 0 to 100) into a mouse speed with
;     speed = slider / 100 * 1.8 + 0.1
; This mod lets you change that 1.8, so the whole slider becomes faster or slower. 1.8 is the game's own value.
; It does nothing while the Raw Input Mouse Fix's 1:1 aim is active: the fix replaces the game's mouse speed, and
; with its UseGameSlider setting it reads where the slider is (0 to 100), never this number. With the fix's 1:1
; aim switched off (F8, or its setting in the Mods panel) the game's own speed applies again, and so does this.

[mod]
name=Mouse Slider Range
; The switch for this mod in ds3_mods.ini, under [modules].
id=mouse_slider_range
author=RHFlyer
version=1.0.0
; The oldest DS3 Mod Loader this mod works with. An older loader says so instead of loading it.
min_loader=1.0.0
description=No-code example: a patch mod, only this mod.ini. Widens the game's Mouse Sensitivity slider; move it to apply. No effect while the mouse fix's 1:1 aim is on.

; The setting shown in the Mods panel. The panel writes it to settings.ini in this folder.
[setting.range]
section=Mouse
key=SliderRange
kind=float
min=0.3
max=5.4
step=0.3
decimals=1
default=1.8
label=Slider range
help=1.8 = normal speed; 3.6 is almost twice as fast (slider 50: 1.0 to 1.9). Move the game's slider to apply. Unused during the mouse fix's 1:1 aim.

; The patch. FUN_00632d90 (which applies the slider) is the only code that reads this number (checked in Ghidra).
[patch.range]
; Where the number is: in the game's read-only data (.rdata).
address=0x00D7AD58
; The 8 bytes there in an unchanged game: the double 1.8. If they differ, nothing is written and the log says so.
expect=00 00 00 C6 CC CC FC 3F
; Write the setting's value there, as a double (8 bytes), the type the game reads it as.
value=range
type=double
