; Resource Counter's manifest: what the proxy and the Mods panel need to know about the mod.
; Format: sdk\README.md. Comments go on their own lines (a ; after a value is part of the value).

[mod]
name=Resource Counter
; Your [modules] key in ds3_mods.ini: a-z, 0-9 and _ only. Don't change it after release.
id=resource_counter
author=RHFlyer
; Three numbers. Third up: a fix. Second: something new. First: the player has to do something (CHANGELOG.txt says what).
version=1.0.0
; The oldest DS3 Mod Loader this mod works with. An older loader says so instead of loading it.
min_loader=1.0.0
description=Shows your six resources in a corner of the screen, with +N for a few seconds when one changes.
; Paths are relative to this folder. The ini is created by the Mods panel on the first change.
file=ResourceCounter.asi
ini=resource_counter.ini

; Each [setting.*] section is one row in the Mods panel, in this order. section / key say where the value lives in
; resource_counter.ini; the mod reads the same keys (ReadSettings in resource_counter.cpp).

[setting.corner]
section=Counter
key=Corner
kind=choice
choices=0:Top left|1:Top right|2:Bottom left|3:Bottom right
default=0
label=Corner
help=Where the box sits. The Auto Pickup add-on's list uses the bottom right.

[setting.size]
section=Counter
key=Size
kind=int
min=50
max=300
step=10
default=100
unit=%
label=Text size

[setting.background]
section=Counter
key=Background
kind=int
min=0
max=100
step=10
default=60
unit=%
label=Background
help=How dark the box behind the text is. 0 = no box.

[setting.paused]
section=Counter
key=ShowWhilePaused
kind=bool
default=0
label=Show while paused

[setting.changes]
section=Counter
key=ShowChanges
kind=bool
default=1
label=Show changes
help=On: +5 (green) or -10 (red) next to a resource for 3 seconds after it changes.

[setting.tungsten]
section=Counter
key=ShowTungsten
kind=bool
default=1
label=Tungsten
group=Resources shown

[setting.semiconductor]
section=Counter
key=ShowSemiconductor
kind=bool
default=1
label=Semiconductor
group=Resources shown

[setting.scrap]
section=Counter
key=ShowScrapMetal
kind=bool
default=1
label=Scrap Metal
group=Resources shown

[setting.gel]
section=Counter
key=ShowSomaticGel
kind=bool
default=1
label=Somatic Gel
group=Resources shown

[setting.transducer]
section=Counter
key=ShowTransducer
kind=bool
default=1
label=Transducer
group=Resources shown

[setting.seals]
section=Counter
key=ShowRationSeals
kind=bool
default=1
label=Ration Seals
group=Resources shown
